name: Fix trailing newlines
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  strip-newlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip trailing newline from package.json and owner.json
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("package.json", ".makefun/owner.json"):
              p = Path(name)
              data = p.read_bytes()
              if data.endswith(b"\n"):
                  p.write_bytes(data[:-1])
                  print(f"stripped trailing newline from {name}: {len(data)} -> {len(data)-1}")
              else:
                  print(f"{name} already has no trailing newline: {len(data)}")
          PY
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .makefun/owner.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Strip trailing newline from package.json and .makefun/owner.json"
            git push
          fi
